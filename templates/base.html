<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TalentFlow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">TalentFlow AI</span>
        <a href="#" class="btn btn-sm btn-outline-light me-2 position-relative" onclick="toggleNotifications()">
            <i class="bi bi-bell-fill"></i>
            <span id="notif-badge" class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill d-none">0</span>
        </a>
        <div>
            <a href="/dashboard/" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
            <button onclick="logout()" class="btn btn-sm btn-danger">Logout</button>
        </div>
    </nav>
    <div id="notif-dropdown" class="d-none container mt-2">
        <div class="card p-3">
            <h6>Notifications</h6>
            <ul id="notif-list" class="list-group"></ul>
        </div>
    </div>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% load static %}
    <script src="{% static 'js/api.js' %}"></script>
    <script>
        if (getToken()) {
            loadNotifications();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
