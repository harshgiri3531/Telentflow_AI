{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TalentFlow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { background: #f5f6fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: 240px;
            background: #16213e; color: white; padding: 20px 0; overflow-y: auto;
        }
        .sidebar .brand { padding: 0 20px 20px; font-weight: 700; font-size: 20px; }
        .sidebar .brand span { color: #4a9eff; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 20px; color: #b8bfd6; text-decoration: none; font-size: 14px;
        }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.08); color: white; }
        .main-wrapper { margin-left: 240px; }
        .topbar {
            background: white; padding: 14px 30px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #eef0f5; position: relative;
        }
        .content-area { padding: 30px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">TalentFlow <span>AI</span></div>
        <a href="/dashboard/" class="active"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="/dashboard/#attendance-section"><i class="bi bi-clock-history"></i> Attendance</a>
        <a href="/dashboard/#leave-section"><i class="bi bi-calendar-check"></i> Leave</a>
        <a href="/dashboard/#goals-section"><i class="bi bi-flag"></i> Goals</a>
        <a href="/dashboard/#reviews-section-my"><i class="bi bi-star"></i> Reviews</a>
    </div>

    <div class="main-wrapper">
        <div class="topbar">
            <div></div>
            <div class="d-flex align-items-center gap-3">
                <a href="#" class="position-relative text-dark" onclick="toggleNotifications()">
                    <i class="bi bi-bell-fill fs-5"></i>
                    <span id="notif-badge" class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill d-none">0</span>
                </a>
                <button onclick="logout()" class="btn btn-sm btn-outline-danger">Logout</button>
            </div>
        </div>
        <div id="notif-dropdown" class="d-none px-4 pt-2">
            <div class="card p-3">
                <h6>Notifications</h6>
                <ul id="notif-list" class="list-group"></ul>
            </div>
        </div>
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/api.js' %}"></script>
    <script>
        if (getToken()) { loadNotifications(); }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
