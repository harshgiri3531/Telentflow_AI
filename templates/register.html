<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - TalentFlow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh">
        <div class="card p-4" style="width: 420px;">
            <h3 class="mb-3 text-center">Create Account</h3>
            <div id="error" class="alert alert-danger d-none"></div>
            <input id="username" class="form-control mb-2" placeholder="Username">
            <input id="email" class="form-control mb-2" placeholder="Email">
            <input id="first_name" class="form-control mb-2" placeholder="First Name">
            <input id="last_name" class="form-control mb-2" placeholder="Last Name">
            <input id="password" type="password" class="form-control mb-2" placeholder="Password">
            <input id="password2" type="password" class="form-control mb-3" placeholder="Confirm Password">
            <button class="btn btn-success w-100" onclick="register()">Register</button>
            <p class="text-center mt-3"><a href="/login/">Already have an account? Login</a></p>
        </div>
    </div>

    <script>
       const API_BASE = window.location.origin + "/api";
        async function register() {
            const payload = {
                username: document.getElementById("username").value,
                email: document.getElementById("email").value,
                first_name: document.getElementById("first_name").value,
                last_name: document.getElementById("last_name").value,
                password: document.getElementById("password").value,
                password2: document.getElementById("password2").value,
            };
            const res = await fetch(API_BASE + "/accounts/register/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            if (res.ok) {
                window.location.href = "/login/";
            } else {
                const data = await res.json();
                const err = document.getElementById("error");
                err.textContent = JSON.stringify(data);
                err.classList.remove("d-none");
            }
        }
    </script>
</body>
</html>
