<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - TalentFlow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh">
        <div class="card p-4" style="width: 400px;">
            <h3 class="mb-3 text-center">TalentFlow AI Login</h3>
            <div id="error" class="alert alert-danger d-none"></div>
            <input id="username" class="form-control mb-2" placeholder="Username">
            <input id="password" type="password" class="form-control mb-3" placeholder="Password">
            <button class="btn btn-primary w-100" onclick="login()">Login</button>
            <p class="text-center mt-3"><a href="/register/">Create account</a></p>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const res = await fetch(API_BASE + "/accounts/login/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem("access_token", data.access);
                localStorage.setItem("refresh_token", data.refresh);
                window.location.href = "/dashboard/";
            } else {
                const err = document.getElementById("error");
                err.textContent = "Invalid credentials";
                err.classList.remove("d-none");
            }
        }
    </script>
</body>
</html>
