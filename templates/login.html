<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - TalentFlow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
        }
        .icon-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .icon-circle i {
            font-size: 30px;
            color: white;
        }
        .btn-custom {
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <div class="icon-circle">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted mb-4">Login to TalentFlow AI</p>
        </div>

        <div id="error" class="alert alert-danger d-none"></div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <input id="username" class="form-control" placeholder="Enter username">
        </div>
        <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <input id="password" type="password" class="form-control" placeholder="Enter password">
        </div>

        <button class="btn btn-primary w-100 btn-custom" onclick="login()">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>

        <p class="text-center mt-4 mb-0 small">
            Don't have an account? <a href="/register/">Create one</a>
        </p>
        <p class="text-center mt-1">
            <a href="/" class="text-muted small"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </p>
    </div>

    <script>
        const API_BASE = window.location.origin + "/api";
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const res = await fetch(API_BASE + "/accounts/login/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem("access_token", data.access);
                localStorage.setItem("refresh_token", data.refresh);
                window.location.href = "/dashboard/";
            } else {
                const err = document.getElementById("error");
                err.textContent = "Invalid credentials";
                err.classList.remove("d-none");
            }
        }
    </script>
</body>
</html>
